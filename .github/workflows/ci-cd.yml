name: CP Engineer SaaS — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Étape 1 : Tests & Qualité ───
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cp_saas_user
          POSTGRES_PASSWORD: cp_saas_password_dev_2026
          POSTGRES_DB: cp_engineer_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run Golden Master Engineering Baseline Tests
        run: |
          npm run test:engineering || node tests/engineering-core.test.js

      - name: Generate Prisma Client & Run Migrations
        env:
          DATABASE_URL: "postgresql://cp_saas_user:cp_saas_password_dev_2026@localhost:5432/cp_engineer_saas"
        run: |
          cd apps/api
          npx prisma generate
          # Si migration disponible: npx prisma migrate deploy

      - name: Run SaaS Unit & Security Tests (Vitest)
        run: |
          npm run test || npx vitest run

  # ─── Étape 2 : Build des Conteneurs ───
  build-docker:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: cp-engineer-api:${{ github.sha }}

  # ─── Étape 3 : Déploiement Continu Staging ───
  deploy-staging:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Staging Environment
        run: |
          echo "🚀 Déploiement en 1 clic vers l'environnement de staging validé."
          echo "Version déployée: ${{ github.sha }}"
